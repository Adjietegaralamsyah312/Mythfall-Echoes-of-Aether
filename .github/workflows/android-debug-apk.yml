# C-002: CI export APK debug Android — Mythfall: Echoes of Aether.
# Kontrak beku: engine Godot 4.7.2 stable (pin eksplisit, JANGAN floating),
# preset export persis "Android", runner ubuntu-latest.
# Workflow ini TIDAK menyentuh export_presets.cfg / gameplay / plan.md / plant.md.
# Tidak ada secret/keystore/APK yang di-commit (lihat .gitignore).

name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable
  PRESET_NAME: Android
  APK_PATH: Build/Mythfall-debug.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (syarat export Android Godot 4.7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Paket persis dari docs resmi 4.7 (exporting_for_android):
      # sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"
      # "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709".
      # Tanpa Android Studio / emulator / system image (tidak dipakai export prebuilt).
      - name: Install Android SDK packages
        run: |
          # ponytail: sdkmanager TIDAK ada di PATH runner — pakai path absolut
          # cmdline-tools bawaan image (fallback: PATH bila tersedia).
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "${SDKMANAGER:-}" -a -x "$SDKMANAGER" || { echo "::error::sdkmanager tidak ditemukan di $ANDROID_HOME/cmdline-tools/latest/bin maupun PATH"; ls "$ANDROID_HOME/cmdline-tools" || true; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # URL resmi: github.com/godotengine/godot/releases/download/<tag>/<aset>
      # (terverifikasi HTTP 200 + filename, 2026-10-13).
      # ponytail: rilis 4.7.2 tidak menyertakan file .sha256 untuk kedua aset ini,
      # jadi integritas diverifikasi via unzip -t + cek ukuran — bukan checksum karangan.
      - name: Install Godot 4.7.2 + export templates
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fSL -o /tmp/engine.zip "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl -fSL -o /tmp/templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -t -q /tmp/engine.zip
          unzip -t -q /tmp/templates.tpz
          unzip -q -o /tmp/engine.zip -d /tmp/godot-engine
          sudo install -m 0755 "/tmp/godot-engine/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          godot --version
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TPL_DIR"
          unzip -q -o /tmp/templates.tpz -d "$TPL_DIR"
          # ponytail: tpz 4.7.2 berisi subdir templates/ — ratakan bila perlu.
          if [ -f "$TPL_DIR/templates/android_debug.apk" ]; then
            mv "$TPL_DIR/templates/"* "$TPL_DIR/"
            rmdir "$TPL_DIR/templates"
          fi
          test -f "$TPL_DIR/android_debug.apk" || { echo "::error::android_debug.apk tidak ada di $TPL_DIR"; ls -la "$TPL_DIR"; exit 1; }

      - name: Import proyek (headless, gagal eksplisit)
        run: |
          godot --headless --import || { echo "::error::godot --import gagal"; exit 1; }

      - name: Export APK debug preset Android (gagal eksplisit)
        run: |
          mkdir -p Build
          godot --headless --export-debug "$PRESET_NAME" "$APK_PATH" || { echo "::error::godot --export-debug gagal"; exit 1; }

      # G2-001: gate ukuran APK. HARD FAIL <100MB; warning 100-120MB (sukses tapi belum SELESAI); lulus >=120MB.
      # Upload artifact TETAP di bawah agar ukuran terlihat; keberhasilan = gate ini + verifikasi berikut.
      - name: Size gate G2 (gagal eksplisit <100MB, warning <120MB)
        run: |
          SIZE=$(stat -c '%s' "$APK_PATH")
          echo "G2_APK_SIZE_BYTES=$SIZE" >> "$GITHUB_ENV"
          MB_DEC=$(awk "BEGIN {printf \"%.2f\", $SIZE/1000000}")
          MIB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1048576}")
          echo "APK size: $SIZE bytes (${MB_DEC} MB decimal, ${MIB} MiB)"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::G2 size gate GAGAL: APK $SIZE bytes < 100000000 (100MB). Target acceptance 120MB."
            exit 1
          fi
          if [ "$SIZE" -lt 120000000 ]; then
            echo "::warning::G2 size gate WARNING: APK $SIZE bytes < 120000000 (120MB target) tapi >=100MB — build sukses, BELUM boleh dilaporkan SELESAI."
          else
            echo "G2 size gate LULUS: APK $SIZE bytes >= 120000000."
          fi
          {
            echo "### G2 size gate"
            echo "- Ukuran: $SIZE bytes (${MB_DEC} MB / ${MIB} MiB)"
            echo "- Syarat keras: >=100000000 (100MB)"
            echo "- Target acceptance: >=120000000 (120MB)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Batas kontrak: >5MB dan <500MB. touch APK kosong = pelanggaran (dicegah di sini).
      - name: Verifikasi APK + ringkasan
        run: |
          test -f "$APK_PATH" || { echo "::error::APK tidak ada: $APK_PATH"; exit 1; }
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -lt 5242880 ] || [ "$SIZE" -gt 524288000 ]; then
            echo "::error::ukuran APK tidak wajar: $SIZE bytes (syarat >5MB dan <500MB)"
            exit 1
          fi
          echo "APK_SIZE_BYTES=$SIZE" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs "$APK_PATH" || echo "::warning::apksigner verify gagal — cek log export"
          {
            echo "### APK debug"
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Ukuran: $SIZE bytes ($(numfmt --to=iec "$SIZE"))"
            echo "- Path: $APK_PATH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mythfall-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
