[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="Build/Mythfall-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
# ponytail: hanya arsitektur ARM64 aktif (sesuai Task 2 plant.md). x86_64 OFF.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86_64=false
# ponytail: version code/name placeholder — naikkan saat rilis nyata.
version/code=1
version/name="0.5.0"
package/unique_name="com.mythfall.echoesofaether"
package/name="Mythfall_Echoes_of_Aether"
package/signed=true
# ponytail: orientation=4 (sensor landscape) = cermin project.godot display/window/handheld/orientation.
screen/orientation=4
screen/immersive_mode=true
# ponytail: keystore SENGAJA tidak diisi — export debug memakai debug keystore
# bawaan editor. JANGAN commit keystore nyata ke repo.
# ponytail: opsi lain diserahkan ke default editor 4.7 (jangan karang opsi).
